
name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build FOSS release
        run: ./gradlew :app:assembleFossRelease

      - name: Find APK
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/foss/release \
            -type f -name '*.apk' ! -name '*unsigned*' \
            | head -1)

          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/foss/release \
              -type f -name '*.apk' | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "FOSS release APK not found!"
            find app/build/outputs -type f
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Found: $APK"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SIGNED_APK="${APK_PATH%.apk}-signed.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -1)

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK_PATH"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -RhoE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' \
            app/build.gradle.kts build.gradle.kts 2>/dev/null \
            | head -1 \
            | sed -E 's/.*"([^"]+)".*/\1/')

          if [ -z "$VERSION" ]; then
            VERSION=$(basename "$SIGNED_APK" | sed -E 's/.*-([0-9]+\.[0-9]+[^-]*)-signed\.apk/\1/')
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not determine application version!"
            exit 1
          fi

          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.ver.outputs.name }}"
          TAG="v${VERSION}-$(date +%Y%m%d%H%M)"

          gh release create "$TAG" "$SIGNED_APK" \
            --title "ImageToolbox $VERSION (FOSS)" \
            --notes "FOSS-сборка ImageToolbox подписана личным ключом."
