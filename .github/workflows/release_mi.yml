
name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build FOSS release
        run: ./gradlew :app:assembleFossRelease

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/foss/release \
            -type f -name '*-foss-universal-release-unsigned.apk' \
            | head -1)

          if [ -z "$APK" ]; then
            echo "FOSS release APK not found!"
            find app/build/outputs -name '*.apk'
            exit 1
          fi

          SIGNED_APK="${APK%-unsigned.apk}.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -1)

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

          echo "APK_PATH=$SIGNED_APK" >> "$GITHUB_ENV"

      - name: Read version
        id: ver
        run: |
          APK_NAME=$(basename "$APK_PATH")
          VN="${APK_NAME#image-toolbox-}"
          VN="${VN%-foss-universal-release.apk}"

          if [ "$VN" = "$APK_NAME" ] || [ -z "$VN" ]; then
            echo "Could not determine application version!"
            exit 1
          fi

          echo "name=$VN" >> "$GITHUB_OUTPUT"

      - name: List APKs
        run: find app/build/outputs -name '*.apk'

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VN="${{ steps.ver.outputs.name }}"
          TAG="v${VN}-$(date +%Y%m%d%H%M)"

          gh release create "$TAG" "$APK_PATH" \
            --title "ImageToolbox $VN (FOSS)" \
            --notes "Сборка ImageToolbox FOSS подписана личным ключом."
            
